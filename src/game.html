<!doctype html>
<html lang="{{site.htmlLang}}" data-lang="{{code}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{pageTitle}}</title>
  <meta name="description" content="{{meta.description}}">
  <link rel="canonical" href="{{canonical}}">
{{hreflang}}
  <meta name="theme-color" content="#faf6ef">
{{ogp}}
{{jsonld}}
  <link rel="stylesheet" href="../css/style.css?v={{v}}">
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-WFHQNP9CT8"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-WFHQNP9CT8');
  </script>
</head>
<body>
  <main id="app">
    <!-- タイトル -->
    <section id="screen-title" class="screen" hidden>
      <div class="title-illust" id="title-illust"></div>
      <h1 class="logo" data-i18n="meta.gameName"></h1>
      <p class="lead" data-i18n="title.lead"></p>
      <p class="note" data-i18n="meta.setInJapan"></p>
      <div class="stack">
        <button id="btn-start" class="primary" data-i18n="title.start"></button>
        <button id="btn-continue" data-i18n="title.continue" hidden></button>
        <button id="btn-gallery" data-i18n="title.gallery"></button>
        <button id="btn-settings" class="ghost" data-i18n="title.settings"></button>
      </div>
      <p class="series-link"><a href="https://solo-living-diary.nacn.app/{{code}}/" data-i18n="title.prequel"></a></p>
{{langNav}}
{{siteNav}}
    </section>

    <!-- 開始設定 -->
    <section id="screen-setup" class="screen" hidden>
      <h2 data-i18n="setup.heading"></h2>
      <form id="setup-form" class="form">
        <div id="handoff-note" class="handoff" hidden>
          <p data-i18n="setup.handoff"></p>
          <p id="handoff-detail" class="hint"></p>
          <button type="button" id="btn-no-handoff" class="ghost" data-i18n="setup.noHandoff"></button>
        </div>
        <div class="row">
          <label><span data-i18n="setup.genderA"></span>
            <select name="genderA"><option value="female" data-i18n="setup.female"></option><option value="male" data-i18n="setup.male"></option></select>
          </label>
          <label><span data-i18n="setup.genderB"></span>
            <select name="genderB"><option value="female" data-i18n="setup.female"></option><option value="male" data-i18n="setup.male"></option></select>
          </label>
        </div>
        <label><span data-i18n="setup.age" data-i18n-params='{"min":22,"max":45}'></span>
          <span class="field"><input name="age" type="number" min="22" max="45" step="1" required><button type="button" data-random="age" data-i18n="setup.random"></button></span>
        </label>
        <label><span id="savings-label" data-i18n="setup.savings" data-i18n-params='{"min":0,"max":1000}'></span>
          <span class="field"><input name="savings" type="number" min="0" max="1000" step="10" required><button type="button" data-random="savings" data-i18n="setup.random"></button></span>
          <output class="hint" data-money-for="savings"></output>
        </label>
        <label><span data-i18n="setup.incomeA"></span>
          <span class="field"><input name="incomeA" type="number" min="0" max="3000" step="10" required><button type="button" data-random="incomeA" data-i18n="setup.random"></button></span>
          <output class="hint" data-money-for="incomeA"></output>
        </label>
        <label><span data-i18n="setup.incomeB"></span>
          <span class="field"><input name="incomeB" type="number" min="0" max="3000" step="10" required><button type="button" data-random="incomeB" data-i18n="setup.random"></button></span>
          <output class="hint" data-money-for="incomeB"></output>
        </label>
        <p class="hint" data-i18n="setup.incomeHint"></p>
        <label><span data-i18n="setup.workStyle"></span>
          <span class="field">
            <select name="workStyle">
              <option value="fulltime_both" data-i18n="workStyles.fulltime_both.fullLabel"></option>
              <option value="parttime" data-i18n="workStyles.parttime.fullLabel"></option>
              <option value="single" data-i18n="workStyles.single.fullLabel"></option>
            </select>
            <button type="button" data-random="workStyle" data-i18n="setup.random"></button>
          </span>
        </label>
        <div class="stack">
          <button type="submit" class="primary" data-i18n="setup.submit"></button>
          <button type="button" id="btn-omakase" data-i18n="setup.omakase"></button>
          <button type="button" class="ghost" data-back data-i18n="setup.back"></button>
        </div>
      </form>
    </section>

    <!-- メイン -->
    <section id="screen-main" class="screen" hidden>
      <header class="status" id="status"></header>
      <ol class="diary" id="diary"></ol>
      <div class="year-summary" id="year-summary" hidden></div>
      <footer class="controls">
        <button data-speed="0" data-i18n="main.pause"></button>
        <button data-speed="1">1x</button>
        <button data-speed="2">2x</button>
      </footer>
    </section>

    <!-- リザルト -->
    <section id="screen-result" class="screen" hidden>
      <div id="result"></div>
      <section class="share">
        <h3 data-i18n="result.share"></h3>
        <img id="share-preview" class="share-preview" data-i18n="result.cardAlt" data-i18n-attr="alt">
        <div class="stack">
          <button id="btn-share" class="primary" data-i18n="result.shareImage"></button>
          <a id="btn-download" class="button" download="newlywed-diary.png" data-i18n="result.saveImage"></a>
          <a id="btn-post" class="button" target="_blank" rel="noopener" data-i18n="result.post"></a>
        </div>
      </section>
      <div class="stack">
        <button id="btn-again" class="primary" data-i18n="result.again"></button>
        <button class="ghost" data-back data-i18n="result.toTitle"></button>
      </div>
    </section>

    <!-- エンディング図鑑 -->
    <section id="screen-gallery" class="screen" hidden>
      <h2 data-i18n="gallery.heading"></h2>
      <div id="gallery"></div>
      <div class="stack">
        <button class="ghost" data-back data-i18n="gallery.back"></button>
      </div>
    </section>

    <!-- 設定 -->
    <section id="screen-settings" class="screen" hidden>
      <h2 data-i18n="settings.heading"></h2>
      <form id="settings-form" class="form">
        <label><span data-i18n="settings.language"></span>
          <select name="lang" id="settings-lang"></select>
        </label>
        <label class="check"><input type="checkbox" name="yearSummary"> <span data-i18n="settings.yearSummary"></span></label>
        <label><span data-i18n="settings.speed"></span>
          <select name="speed">
            <option value="1">1x</option>
            <option value="2">2x</option>
          </select>
        </label>
      </form>
      <div class="stack">
        <button id="btn-clear" class="danger" data-i18n="settings.clear"></button>
        <button class="ghost" data-back data-i18n="settings.back"></button>
      </div>
      <p class="hint" data-i18n="settings.clearHint"></p>
    </section>
  </main>

  <!-- イベント -->
  <div id="modal" class="modal" hidden>
    <div class="modal-body" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div id="modal-illust"></div>
      <h3 id="modal-title"></h3>
      <p id="modal-text"></p>
      <div id="modal-options" class="stack"></div>
    </div>
  </div>

  <script type="module" src="../js/app.js?v={{v}}"></script>
{{suggestBanner}}
</body>
</html>

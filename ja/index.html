<div class="suggest" id="langSuggest" hidden>
    <span id="langSuggestText"></span> <a id="langSuggestLink" href="#"></a>

  <script>
  (() => {
    // ブラウザの言語が別の対応言語なら、その言語のページを1行で案内する（自動では移動しない。閉じたら次から出さない）
    const ALT = [{"match": ["ja"], "text": "新婚日記は日本語でも遊べます。", "link": "日本語で遊ぶ", "href": "../ja/", "lang": "ja", "code": "ja", "current": true}, {"match": ["en"], "text": "Newlywed Diary is also available in English.", "link": "Play in English", "href": "../en/", "lang": "en", "code": "en", "current": false}, {"match": ["zh-tw", "zh-hant", "zh-hk", "zh-mo"], "text": "新婚日記也提供繁體中文版。", "link": "以繁體中文遊玩", "href": "../zh-tw/", "lang": "zh-Hant-TW", "code": "zh-tw", "current": false}, {"match": ["ko"], "text": "신혼일기는 한국어로도 플레이할 수 있습니다.", "link": "한국어로 플레이", "href": "../ko/", "lang": "ko", "code": "ko", "current": false}, {"match": ["es", "!es-es"], "text": "Diario de recién casados también está disponible en español.", "link": "Jugar en español", "href": "../es/", "lang": "es-419", "code": "es", "current": false}];
    // match は言語コードの先頭の一致。「!」付きは除外（例: スペイン語版は中南米向けなので es-ES は外す）
    const langMatches = (lang, list) => list.some(m => m[0] !== '!' && lang.startsWith(m)) && !list.some(m => m[0] === '!' && lang.startsWith(m.slice(1)));
    // 自分で選んだ言語を覚えて、次に / を開いたときはその言語へ移動する（言語の切り替えリンクと、この案内のリンク）
    const remember = code => { try { localStorage.setItem('lang', code); } catch (e) { /* noop */ } };
    // 切り替えリンクはこのあとに出てくるので、ページ全体でクリックを受け取る
    document.addEventListener('click', e => {
      const a = e.target.closest('.langs a[data-code], #langSuggestLink');
      if (a && a.dataset.code) remember(a.dataset.code);
    });
    const KEY = 'lang-suggest-closed';
    try { if (localStorage.getItem(KEY)) return; } catch (e) { /* 保存できない環境 */ }
    const langs = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || '']).map(l => l.toLowerCase());
    // 一番希望している言語だけを見る。対応していない言語か、今のページの言語なら何も出さない
    const first = langs[0] || '';
    const alt = ALT.find(a => langMatches(first, a.match));
    if (!alt || alt.current) return;
    const box = document.getElementById('langSuggest');
    document.getElementById('langSuggestText').textContent = alt.text;
    const link = document.getElementById('langSuggestLink');
    link.textContent = alt.link; link.href = alt.href; link.lang = alt.lang; link.dataset.code = alt.code;
    box.lang = alt.lang;
    box.hidden = false;
    document.getElementById('langSuggestClose').addEventListener('click', () => {
      box.hidden = true;
      try { localStorage.setItem(KEY, '1'); } catch (e) { /* noop */ }
    });
  })();
  </script>

<!-- Cookie の同意のバナー（nacn.app 共通。元の版は claude-skills の consent-mode スキル） -->
<div class="nacn-consent" id="nacnConsent" role="region" aria-label="Cookie の同意" hidden>
  <p>このサイトは、アクセスの集計のために Cookie を使います。同意しなくても、そのまま遊べます。 <a href="https://nacn.app/ja/privacy.html">プライバシーポリシー</a></p>

<style>
.nacn-consent{ position:fixed; left:8px; right:8px; bottom:8px; z-index:1000; max-width:720px; margin:0 auto; padding:12px 14px;
  display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; color:#f4f1ff; background:#1d1a33; border:3px solid #f4f1ff;
  box-shadow:0 4px 0 rgba(0,0,0,.35); font-size:.9rem; line-height:1.6; }
.nacn-consent[hidden]{ display:none; }
.nacn-consent p{ flex:1 1 280px; margin:0; }
.nacn-consent a{ color:#ffd66b; }
.nacn-consent-btns{ display:flex; gap:8px; }
/* 同意する・しないは同じ大きさ・同じ見た目にする（どちらかに誘導しない） */
.nacn-consent button{ min-width:7em; padding:6px 12px; font:inherit; color:#1d1a33; background:#f4f1ff; border:2px solid #f4f1ff; cursor:pointer; }
.nacn-consent button:focus-visible{ outline:3px solid #ffd66b; outline-offset:2px; }
</style>
<script>
(() => {
  const bar = document.getElementById('nacnConsent');
  // ページの中で言語を切り替えるアプリ（1つの HTML で全言語）は、data-strings に言語ごとの文言を持たせ、表示する前に今の言語の文言にする。
  // キーは <html lang> を小文字にしたもの（なければ「-」の前）。値は {text, policy, policyHref, accept, reject, settings, label}
  const strings = bar.dataset.strings ? JSON.parse(bar.dataset.strings) : null;
  const localize = () => {
    if (!strings) return;
    const lang = (document.documentElement.lang || '').toLowerCase();
    const t = strings[lang] || strings[lang.split('-')[0]];
    if (!t) return;
    const link = bar.querySelector('p a');
    bar.querySelector('p').firstChild.textContent = t.text + ' ';
    link.textContent = t.policy; link.href = t.policyHref;
    bar.querySelector('[data-consent="granted"]').textContent = t.accept;
    bar.querySelector('[data-consent="denied"]').textContent = t.reject;
    bar.setAttribute('aria-label', t.label);
    document.querySelectorAll('[data-consent-open]').forEach(a => { a.textContent = t.settings; });
  };
  const pad = () => { document.body.style.paddingBottom = bar.hidden ? '' : (bar.offsetHeight + 16) + 'px'; };
  const show = () => { localize(); bar.hidden = false; pad(); };
  const choose = v => {
    // nacn.app の全サブドメインで同じ選択を使う（ローカルでは Domain を付けない）
    const domain = /(^|\.)nacn\.app$/.test(location.hostname) ? '; Domain=.nacn.app' : '';
    const secure = location.protocol === 'https:' ? '; Secure' : '';
    document.cookie = `nacn_consent=v1.${v}; Max-Age=34128000; Path=/; SameSite=Lax${secure}${domain}`;
    gtag('consent', 'update', {ad_storage: v, ad_user_data: v, ad_personalization: v, analytics_storage: v});
    bar.hidden = true; pad();
  };
  bar.querySelectorAll('[data-consent]').forEach(b => b.addEventListener('click', () => choose(b.dataset.consent)));
  // いつでも選び直せるように、ページ下のメニュー（data-consent-menu を付けた ul か .site-nav ul）に「Cookie の設定」を足す。
  // ほかの場所に置くなら data-consent-open を付けた要素
  const menu = document.querySelector('[data-consent-menu]') || document.querySelector('.site-nav ul');
  if (menu) menu.insertAdjacentHTML('beforeend', '<li><a href="#" data-consent-open>Cookie の設定</a></li>');
  document.querySelectorAll('[data-consent-open]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); show(); }));
  localize();
  const c = window.nacnConsent || {};
  if (c.need && !c.saved) show();
})();
</script>

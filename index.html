<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>新婚日記</title>
  <meta name="description" content="結婚から定年までを「買う・買わない／高い・普通・安い」の選択だけで駆け抜ける人生シミュレーション。">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app">
    <!-- タイトル -->
    <section id="screen-title" class="screen">
      <h1 class="logo">新婚日記</h1>
      <p class="lead">結婚から定年まで、<br>選択だけで駆け抜ける人生シミュレーション</p>
      <div class="stack">
        <button id="btn-start" class="primary">はじめる</button>
        <button id="btn-continue" hidden>続きから</button>
      </div>
      <p class="note">プロトタイプ版（結婚式・子ども・車・家・定年）</p>
    </section>

    <!-- 開始設定 -->
    <section id="screen-setup" class="screen" hidden>
      <h2>開始設定</h2>
      <form id="setup-form" class="form">
        <div class="row">
          <label>主人公の性別
            <select name="genderA"><option value="female">女性</option><option value="male">男性</option></select>
          </label>
          <label>パートナーの性別
            <select name="genderB"><option value="female">女性</option><option value="male">男性</option></select>
          </label>
        </div>
        <label>結婚時の年齢（22〜45歳）
          <span class="field"><input name="age" type="number" min="22" max="45" step="1" required><button type="button" data-random="age">ランダム</button></span>
        </label>
        <label>貯金（0〜1,000万円）
          <span class="field"><input name="savings" type="number" min="0" max="1000" step="10" required><button type="button" data-random="savings">ランダム</button></span>
        </label>
        <label>主人公の年収（万円）
          <span class="field"><input name="incomeA" type="number" min="0" max="3000" step="10" required><button type="button" data-random="incomeA">ランダム</button></span>
        </label>
        <label>パートナーの年収（万円・フルタイムの場合）
          <span class="field"><input name="incomeB" type="number" min="0" max="3000" step="10" required><button type="button" data-random="incomeB">ランダム</button></span>
        </label>
        <p class="hint">年収の初期値は、その年齢の中央値です。</p>
        <label>働き方
          <span class="field">
            <select name="workStyle">
              <option value="fulltime_both">共働き（フルタイム）</option>
              <option value="parttime">共働き（パートナーが時短・パート）</option>
              <option value="single">片働き（パートナーは働かない）</option>
            </select>
            <button type="button" data-random="workStyle">ランダム</button>
          </span>
        </label>
        <div class="stack">
          <button type="submit" class="primary">この設定ではじめる</button>
          <button type="button" id="btn-omakase">全部おまかせではじめる</button>
          <button type="button" id="btn-setup-back" class="ghost">タイトルへ戻る</button>
        </div>
      </form>
    </section>

    <!-- メイン -->
    <section id="screen-main" class="screen" hidden>
      <header class="status" id="status"></header>
      <ol class="diary" id="diary"></ol>
      <footer class="controls">
        <button data-speed="0">一時停止</button>
        <button data-speed="1">1x</button>
        <button data-speed="2">2x</button>
      </footer>
    </section>

    <!-- リザルト -->
    <section id="screen-result" class="screen" hidden>
      <div id="result"></div>
      <div class="stack">
        <button id="btn-again" class="primary">もう一度</button>
        <button id="btn-result-title" class="ghost">タイトルへ</button>
      </div>
    </section>
  </main>

  <!-- イベント -->
  <div id="modal" class="modal" hidden>
    <div class="modal-body" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h3 id="modal-title"></h3>
      <p id="modal-text"></p>
      <div id="modal-options" class="stack"></div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
